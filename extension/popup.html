<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 8px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: all 0.5s ease;
        }

        .label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .status {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .status-normal {
            color: #10b981;
        }

        .status-suspicious {
            color: #f59e0b;
        }

        .status-risk {
            color: #ef4444;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #64748b;
        }

        .config {
            margin-top: 18px;
            text-align: left;
        }

        .config label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        .config input {
            width: 100%;
            border: 1px solid #334155;
            background: #020617;
            color: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
        }

        .config button {
            width: 100%;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
        }

        .config small {
            display: block;
            margin-top: 8px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .config-status {
            min-height: 18px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">Your Digital Trust Score</div>
        <div id="score" class="score-circle">--</div>
        <div id="status" class="status">Initializing...</div>
        <div class="footer">AI-Powered Anomaly Detection active</div>
        <div class="config">
            <label for="backend-url">Backend URL</label>
            <input id="backend-url" type="url" placeholder="https://your-app.onrender.com">
            <button id="save-backend-url" type="button">Save Backend URL</button>
            <div id="config-status" class="config-status"></div>
            <small>Use your live hosted app URL here. Local default is `http://localhost:8000`.</small>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
