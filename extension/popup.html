<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 8px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: all 0.5s ease;
        }

        .label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .status {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .status-normal {
            color: #10b981;
        }

        .status-suspicious {
            color: #f59e0b;
        }

        .status-risk {
            color: #ef4444;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">Your Digital Trust Score</div>
        <div id="score" class="score-circle">--</div>
        <div id="status" class="status">Initializing...</div>
        <div class="footer">AI-Powered Anomaly Detection active</div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
